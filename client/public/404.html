<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Unity Pulse</title>
    <!-- GitHub Pages SPA redirect: encodes the path into a query param
         so index.html can restore it via client-side routing. -->
    <script>
      var pathSegmentsToKeep = 1; // /unity-pulse/ is the base
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
